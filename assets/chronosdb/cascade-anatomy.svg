<text x="78" y="188" fill="#ECF8FA" font-size="25" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">Trace the failure like a signal moving through a circuit.</text><rect x="86" y="350" width="208" height="198" rx="24" fill="url(#glass)" stroke="#FFC857" stroke-width="1.5" opacity="1"/><text x="114" y="390" fill="#FFC857" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2" font-family="Segoe UI, Arial, sans-serif">01</text><text x="114" y="444" fill="#ECF8FA" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">SUPPLIER</text><text x="114" y="482" fill="#91B4C0" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">S-104 unavailable</text><circle cx="250" cy="510" r="13.799999999999999" fill="#FFC857" opacity="0.12" /><circle cx="250" cy="510" r="6" fill="#FFC857" /><rect x="391" y="350" width="208" height="198" rx="24" fill="url(#glass)" stroke="#FF6B6B" stroke-width="1.5" opacity="1"/><text x="419" y="390" fill="#FF6B6B" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2" font-family="Segoe UI, Arial, sans-serif">02</text><text x="419" y="444" fill="#ECF8FA" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">COMPONENT</text><text x="419" y="482" fill="#91B4C0" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">MCU-42 shortage</text><circle cx="555" cy="510" r="13.799999999999999" fill="#FF6B6B" opacity="0.12" /><circle cx="555" cy="510" r="6" fill="#FF6B6B" /><rect x="696" y="350" width="208" height="198" rx="24" fill="url(#glass)" stroke="#FFC857" stroke-width="1.5" opacity="1"/><text x="724" y="390" fill="#FFC857" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2" font-family="Segoe UI, Arial, sans-serif">03</text><text x="724" y="444" fill="#ECF8FA" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">PRODUCTION</text><text x="724" y="482" fill="#91B4C0" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">PO-876 / PO-882</text><circle cx="860" cy="510" r="13.799999999999999" fill="#FFC857" opacity="0.12" /><circle cx="860" cy="510" r="6" fill="#FFC857" /><rect x="1001" y="350" width="208" height="198" rx="24" fill="url(#glass)" stroke="#FF6B6B" stroke-width="1.5" opacity="1"/><text x="1029" y="390" fill="#FF6B6B" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2" font-family="Segoe UI, Arial, sans-serif">04</text><text x="1029" y="444" fill="#ECF8FA" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">CUSTOMER</text><text x="1029" y="482" fill="#91B4C0" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">CO-701 / CO-711</text><circle cx="1165" cy="510" r="13.799999999999999" fill="#FF6B6B" opacity="0.12" /><circle cx="1165" cy="510" r="6" fill="#FF6B6B" /><rect x="1306" y="350" width="208" height="198" rx="24" fill="url(#glass)" stroke="#B8F16B" stroke-width="1.5" opacity="1"/><text x="1334" y="390" fill="#B8F16B" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2" font-family="Segoe UI, Arial, sans-serif">05</text><text x="1334" y="444" fill="#ECF8FA" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">VALUE</text><text x="1334" y="482" fill="#91B4C0" font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">₹18.4L at risk</text><circle cx="1470" cy="510" r="13.799999999999999" fill="#B8F16B" opacity="0.12" /><circle cx="1470" cy="510" r="6" fill="#B8F16B" /><path d="M 294 449 H 386" stroke="url(#riskFlow)" stroke-width="5" marker-end="url(#arrowAmber)"/><path d="M 599 449 H 691" stroke="url(#riskFlow)" stroke-width="5" marker-end="url(#arrowAmber)"/><path d="M 904 449 H 996" stroke="url(#riskFlow)" stroke-width="5" marker-end="url(#arrowAmber)"/><path d="M 1209 449 H 1301" stroke="url(#riskFlow)" stroke-width="5" marker-end="url(#arrowAmber)"/><rect x="200" y="665" width="1200" height="106" rx="16" fill="#102B39" stroke="#194456" stroke-width="1.5" opacity="1"/><rect x="230" y="702" width="174" height="32" rx="16" fill="#6EF3FF" stroke="#6EF3FF" stroke-width="1.5" opacity="0.13"/><circle cx="246" cy="718" r="4" fill="#6EF3FF"/><text x="258" y="723" fill="#6EF3FF" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0.7" font-family="Segoe UI, Arial, sans-serif">CALCULATION TRACE</text><text x="450" y="728" fill="#ECF8FA" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">inventory projection</text><text x="670" y="728" fill="#6EF3FF" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">→</text><text x="715" y="728" fill="#ECF8FA" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">BOM traversal</text><text x="900" y="728" fill="#6EF3FF" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">→</text><text x="945" y="728" fill="#ECF8FA" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">SLA rule v3</text><text x="1112" y="728" fill="#6EF3FF" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">→</text><text x="1158" y="728" fill="#B8F16B" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">47 source rows</text></svg>
