<text x="78" y="186" fill="#ECF8FA" font-size="26" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">A metric is only useful when you can walk backwards from it.</text><rect x="92" y="350" width="248" height="160" rx="22" fill="url(#glass)" stroke="#FF6B6B" stroke-width="1.5" opacity="1"/><text x="116" y="388" fill="#FF6B6B" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.6" font-family="Segoe UI, Arial, sans-serif">CLAIM</text><text x="116" y="448" fill="#ECF8FA" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">₹18.4L revenue at risk</text><path d="M 340 430 H 378" stroke="#6EF3FF" stroke-width="3" marker-end="url(#arrowCyan)"/><rect x="392" y="350" width="248" height="160" rx="22" fill="url(#glass)" stroke="#6EF3FF" stroke-width="1.5" opacity="1"/><text x="416" y="388" fill="#6EF3FF" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.6" font-family="Segoe UI, Arial, sans-serif">RUN</text><text x="416" y="448" fill="#ECF8FA" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">SR-2026-0118</text><path d="M 640 430 H 678" stroke="#6EF3FF" stroke-width="3" marker-end="url(#arrowCyan)"/><rect x="692" y="350" width="248" height="160" rx="22" fill="url(#glass)" stroke="#FFC857" stroke-width="1.5" opacity="1"/><text x="716" y="388" fill="#FFC857" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.6" font-family="Segoe UI, Arial, sans-serif">RULE</text><text x="716" y="448" fill="#ECF8FA" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">revenue_at_risk_v3</text><path d="M 940 430 H 978" stroke="#6EF3FF" stroke-width="3" marker-end="url(#arrowCyan)"/><rect x="992" y="350" width="248" height="160" rx="22" fill="url(#glass)" stroke="#B8F16B" stroke-width="1.5" opacity="1"/><text x="1016" y="388" fill="#B8F16B" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.6" font-family="Segoe UI, Arial, sans-serif">ROWS</text><text x="1016" y="448" fill="#ECF8FA" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">47 Db2 records</text><path d="M 1240 430 H 1278" stroke="#6EF3FF" stroke-width="3" marker-end="url(#arrowCyan)"/><rect x="1292" y="350" width="248" height="160" rx="22" fill="url(#glass)" stroke="#6EF3FF" stroke-width="1.5" opacity="1"/><text x="1316" y="388" fill="#6EF3FF" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.6" font-family="Segoe UI, Arial, sans-serif">AUDIT</text><text x="1316" y="448" fill="#ECF8FA" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">verified  /  14:02</text><rect x="250" y="640" width="1100" height="100" rx="16" fill="#102B39" stroke="#194456" stroke-width="1.5" opacity="1"/><text x="286" y="681" fill="#91B4C0" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.4" font-family="Segoe UI, Arial, sans-serif">SOURCE CLASS</text><rect x="286" y="700" width="145" height="32" rx="16" fill="#6EF3FF" stroke="#6EF3FF" stroke-width="1.5" opacity="0.13"/><circle cx="302" cy="716" r="4" fill="#6EF3FF"/><text x="314" y="721" fill="#6EF3FF" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0.7" font-family="Segoe UI, Arial, sans-serif">DATABASE FACT</text><rect x="470" y="700" width="150" height="32" rx="16" fill="#FFC857" stroke="#FFC857" stroke-width="1.5" opacity="0.13"/><circle cx="486" cy="716" r="4" fill="#FFC857"/><text x="498" y="721" fill="#FFC857" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0.7" font-family="Segoe UI, Arial, sans-serif">DERIVED VALUE</text><rect x="660" y="700" width="160" height="32" rx="16" fill="#B8F16B" stroke="#B8F16B" stroke-width="1.5" opacity="0.13"/><circle cx="676" cy="716" r="4" fill="#B8F16B"/><text x="688" y="721" fill="#B8F16B" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0.7" font-family="Segoe UI, Arial, sans-serif">RETRIEVED DOC</text><rect x="860" y="700" width="178" height="32" rx="16" fill="#FF6B6B" stroke="#FF6B6B" stroke-width="1.5" opacity="0.13"/><circle cx="876" cy="716" r="4" fill="#FF6B6B"/><text x="888" y="721" fill="#FF6B6B" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0.7" font-family="Segoe UI, Arial, sans-serif">MODEL NARRATIVE</text><text x="1180" y="720" fill="#ECF8FA" font-size="14" font-weight="700" text-anchor="end" letter-spacing="1.4" font-family="Segoe UI, Arial, sans-serif">TRACEABLE</text></svg>
