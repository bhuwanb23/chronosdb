"#6EF3FF" opacity="0.12" filter="url(#glowCyan)"/><circle cx="1110" cy="390" r="14" fill="#6EF3FF" filter="url(#glowCyan)"/><rect x="1000" y="432" width="220" height="76" rx="18" fill="#102B39" stroke="#6EF3FF" stroke-width="1.5" opacity="1"/><text x="1110" y="463" fill="#6EF3FF" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.1" font-family="Segoe UI, Arial, sans-serif">FACILITIES</text><text x="1110" y="488" fill="#91B4C0" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">Pune + Chennai</text><circle cx="1430" cy="420" r="32.199999999999996" fill="#B8F16B" opacity="0.12" /><circle cx="1430" cy="420" r="14" fill="#B8F16B" /><rect x="1320" y="462" width="220" height="76" rx="18" fill="#102B39" stroke="#B8F16B" stroke-width="1.5" opacity="1"/><text x="1430" y="493" fill="#B8F16B" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.1" font-family="Segoe UI, Arial, sans-serif">CUSTOMERS</text><text x="1430" y="518" fill="#91B4C0" font-size="12" font-weight="400" text-anchor="middle" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">SLA network</text><rect x="635" y="690" width="190" height="32" rx="16" fill="#FF6B6B" stroke="#FF6B6B" stroke-width="1.5" opacity="0.13"/><circle cx="651" cy="706" r="4" fill="#FF6B6B"/><text x="663" y="711" fill="#FF6B6B" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0.7" font-family="Segoe UI, Arial, sans-serif">IMPACT PROPAGATES</text><text x="865" y="712" fill="#ECF8FA" font-size="17" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">until an intervention changes the path</text></svg>
