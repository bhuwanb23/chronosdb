        <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"
             viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
          <title id="title">Trust boundary</title>
          <desc id="desc">ChronosDB visual asset in the Temporal Operations design system.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07141E"/>
    <stop offset="0.58" stop-color="#0A1D2A"/>
    <stop offset="1" stop-color="#102C3A"/>
  </linearGradient>
  <linearGradient id="cyanFlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6EF3FF" stop-opacity="0.15"/>
    <stop offset="0.5" stop-color="#6EF3FF"/>
    <stop offset="1" stop-color="#2DD4BF"/>
  </linearGradient>
  <linearGradient id="riskFlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFC857"/>
    <stop offset="1" stop-color="#FF6B6B"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#193E4D" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#0B202D" stop-opacity="0.8"/>
  </linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#194456" stroke-width="1" opacity="0.42"/>
    <circle cx="0" cy="0" r="1.4" fill="#6EF3FF" opacity="0.35"/>
  </pattern>
  <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowAmber" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.3"/>
  </filter>
  <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6EF3FF"/>
  </marker>
  <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC857"/>
  </marker>
</defs>

          <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
          <rect width="1600" height="900" rx="28" fill="url(#grid)" opacity="0.42"/>
          <circle cx="1470" cy="-20" r="260" fill="#6EF3FF" opacity="0.05"/>
          <circle cx="-90" cy="960" r="270" fill="#2DD4BF" opacity="0.04"/>
          <text x="76" y="78" fill="#ECF8FA" font-size="30" font-weight="700"
                font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.3">TRUST BOUNDARY</text>
          <text x="76" y="116" fill="#91B4C0" font-size="20" font-family="Segoe UI, Arial, sans-serif" letter-spacing="0.4">THE MODEL CAN SPEAK  /  ONLY RULES CAN CALCULATE  /  ONLY Db2 CAN PROVE</text>
<text x="78" y="180" fill="#ECF8FA" font-size="26" font-weight="600" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">ChronosDB keeps the dangerous permissions outside the prompt.</text><rect x="100" y="300" width="420" height="400" rx="26" fill="#102B39" stroke="#FF6B6B" stroke-width="1.5" opacity="1"/><rect x="134" y="334" width="126" height="32" rx="16" fill="#FF6B6B" stroke="#FF6B6B" stroke-width="1.5" opacity="0.13"/><circle cx="150" cy="350" r="4" fill="#FF6B6B"/><text x="162" y="355" fill="#FF6B6B" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0.7" font-family="Segoe UI, Arial, sans-serif">MODEL ZONE</text><text x="134" y="410" fill="#ECF8FA" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">May interpret</text><text x="134" y="450" fill="#ECF8FA" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">May retrieve</text><text x="134" y="490" fill="#ECF8FA" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">May explain</text><text x="134" y="574" fill="#FF6B6B" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">May not calculate</text><text x="134" y="612" fill="#FF6B6B" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">May not write</text><path d="M 520 500 H 1080" stroke="#FFC857" stroke-width="2" stroke-dasharray="8 10"/><text x="800" y="464" fill="#FFC857" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.6" font-family="Segoe UI, Arial, sans-serif">VALIDATION BOUNDARY</text><rect x="1080" y="300" width="420" height="400" rx="26" fill="#102B39" stroke="#B8F16B" stroke-width="1.5" opacity="1"/><rect x="1114" y="334" width="126" height="32" rx="16" fill="#B8F16B" stroke="#B8F16B" stroke-width="1.5" opacity="0.13"/><circle cx="1130" cy="350" r="4" fill="#B8F16B"/><text x="1142" y="355" fill="#B8F16B" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0.7" font-family="Segoe UI, Arial, sans-serif">TRUTH ZONE</text><text x="1114" y="410" fill="#ECF8FA" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">Typed scenario</text><text x="1114" y="450" fill="#ECF8FA" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">Deterministic rules</text><text x="1114" y="490" fill="#ECF8FA" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">Db2 evidence</text><text x="1114" y="574" fill="#B8F16B" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">Numbers verified</text><text x="1114" y="612" fill="#B8F16B" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">Audit preserved</text><rect x="420" y="780" width="760" height="58" rx="16" fill="#0C2531" stroke="#194456" stroke-width="1.5" opacity="1"/><text x="800" y="817" fill="#ECF8FA" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="0" font-family="Segoe UI, Arial, sans-serif">If the LLM disappears, the evidence-backed summary remains.</text></svg>
