version: '3.8'

services:
  db2:
    image: ibmcom/db2:11.5.9
    container_name: chronosdb_db2
    environment:
      - DB2INST1_PASSWORD=secure_password_123
      - DB2INST1_PORT=50000
      - DB2INST1_DATABASE=CHRONOSDB
    ports:
      - "50000:50000"
    volumes:
      - db2_data:/database
    restart: unless-stopped

  backend:
    build: ./docker/backend
    container_name: chronosdb_backend
    environment:
      - DB2_HOST=db2
      - DB2_PORT=50000
      - DB2_DATABASE=CHRONOSDB
      - DB2_USER=chronosdb
      - DB2_PASSWORD=secure_password_123
      - LLM_PROVIDER=LOCAL
      - EMBEDDING_MODEL=bge-small-en-v1.5
      - CHRONOSDB_API_KEY=chronosdb_api_key_123
      - CHRONOSDB_AUDIT_KEY=chronosdb_audit_key_123
    ports:
      - "8000:8000"
    depends_on:
      - db2
    restart: unless-stopped

  frontend:
    build: ./docker/frontend
    container_name: chronosdb_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db2_data:

# Phase 15L: Docker Packaging
# Preferred evaluation mode.
# Single command deployment: docker compose up
