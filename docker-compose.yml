# ChronosDB single-command deployment (Phase 15L)
# Usage: docker compose up -d --build
name: chronosdb

services:
  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    container_name: chronosdb_db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:-change-me}
      DBNAME: ${DB2_DATABASE:-CHRONOSDB}
      BLU: "false"
    ports:
      - "${DB2_PORT:-50000}:50000"
    volumes:
      - db2_data:/database
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to $${DBNAME}' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: chronosdb_backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      SCHEMA_VERSION: ${SCHEMA_VERSION:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB2_HOST: db2
      DB2_PORT: 50000
      DB2_DATABASE: ${DB2_DATABASE:-CHRONOSDB}
      DB2_USERNAME: ${DB2_USERNAME:-db2inst1}
      DB2_PASSWORD: ${DB2_PASSWORD:-change-me}
      DB2_SCHEMA: ${DB2_SCHEMA:-CHRONOSDB}
      LLM_PROVIDER: ${LLM_PROVIDER:-LOCAL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-small-en-v1.5}
    ports:
      - "8000:8000"
    depends_on:
      db2:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: chronosdb_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db2_data:
