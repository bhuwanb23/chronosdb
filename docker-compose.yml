version: "3.8"

# Phase 15L: Docker Packaging (hardened)
#
# No credential has a default. Compose refuses to start until the values are set
# in the environment or in a local .env file that is not committed.
# The database port is published on loopback only.

services:
  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    container_name: chronosdb_db2
    privileged: true
    environment:
      - LICENSE=accept
      - DB2INST1_PASSWORD=${DB2INST1_PASSWORD:?set DB2INST1_PASSWORD in .env}
      - DB2INST1_DATABASE=${DB2_DATABASE:-CHRONOSDB}
    ports:
      - "127.0.0.1:50000:50000"
    volumes:
      - db2_data:/database
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to $${DBNAME}' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: chronosdb_backend
    environment:
      - DB2_HOST=db2
      - DB2_PORT=50000
      - DB2_DATABASE=${DB2_DATABASE:-CHRONOSDB}
      - DB2_USER=${DB2_USER:?set DB2_USER in .env}
      - DB2_PASSWORD=${DB2_PASSWORD:?set DB2_PASSWORD in .env}
      - DB2_SCHEMA=${DB2_SCHEMA:-CHRONOSDB}
      - LLM_PROVIDER=${LLM_PROVIDER:-LOCAL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-small-en-v1.5}
      - CHRONOSDB_API_KEY=${CHRONOSDB_API_KEY:?set CHRONOSDB_API_KEY in .env}
      - CHRONOSDB_AUDIT_KEY=${CHRONOSDB_AUDIT_KEY:?set CHRONOSDB_AUDIT_KEY in .env}
      - CHRONOSDB_DOCS_ENABLED=false
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db2:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: chronosdb_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db2_data:
