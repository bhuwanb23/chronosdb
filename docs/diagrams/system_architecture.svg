<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background-color: #0f172a; font-family: Inter, sans-serif;">
  <!-- Phase 16K: Architecture Diagrams -->
  <!-- System Architecture Diagram -->
  
  <!-- Title -->
  <text x="400" y="40" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">ChronosDB System Architecture</text>
  <text x="400" y="70" font-size="14" fill="#94a3b8" text-anchor="middle">Phase 5-15: Impact → Simulation → Optimization → Evidence → AI → Trust → API → War Room → Benchmark → Reliability → Reproducibility</text>
  
  <!-- User -->
  <rect x="50" y="100" width="100" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="135" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">User / Judge</text>
  
  <!-- API Platform (Phase 11) -->
  <rect x="200" y="100" width="100" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="250" y="135" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">API Platform<br/>(Phase 11)</text>
  
  <!-- War Room UI (Phase 12) -->
  <rect x="200" y="200" width="100" height="60" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="250" y="235" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">War Room UI<br/>(Phase 12)</text>
  
  <!-- Impact Engine (Phase 5) -->
  <rect x="350" y="100" width="100" height="60" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="135" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Impact Engine<br/>(Phase 5)</text>
  
  <!-- Simulation Engine (Phase 6) -->
  <rect x="350" y="200" width="100" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="235" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Simulation<br/>(Phase 6)</text>
  
  <!-- Optimization Engine (Phase 7) -->
  <rect x="350" y="300" width="100" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="335" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Optimization<br/>(Phase 7)</text>
  
  <!-- Evidence Layer (Phase 8) -->
  <rect x="500" y="100" width="100" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="135" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Evidence<br/>(Phase 8)</text>
  
  <!-- Controlled AI (Phase 9) -->
  <rect x="500" y="200" width="100" height="60" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="550" y="235" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Controlled AI<br/>(Phase 9)</text>
  
  <!-- Trust Platform (Phase 10) -->
  <rect x="500" y="300" width="100" height="60" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="550" y="335" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Trust Platform<br/>(Phase 10)</text>
  
  <!-- Benchmark Framework (Phase 13) -->
  <rect x="650" y="150" width="100" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="700" y="185" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Benchmark<br/>(Phase 13)</text>
  
  <!-- Reliability Suite (Phase 14) -->
  <rect x="650" y="250" width="100" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="700" y="285" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Reliability<br/>(Phase 14)</text>
  
  <!-- Reproducible Release (Phase 15) -->
  <rect x="650" y="350" width="100" height="60" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="700" y="385" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Reproducibility<br/>(Phase 15)</text>
  
  <!-- Connections -->
  <line x1="150" y1="130" x2="200" y2="130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="130" x2="350" y2="130" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="230" x2="350" y2="230" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="130" x2="500" y2="130" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="230" x2="500" y2="230" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="330" x2="500" y2="330" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="180" x2="650" y2="180" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="280" x2="650" y2="280" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="380" x2="650" y2="380" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
