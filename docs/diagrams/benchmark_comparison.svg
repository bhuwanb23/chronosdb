  <rect x="80" y="760" width="1440" height="80" rx="14" fill="#0F172A" stroke="#334155"/>
  <text x="110" y="795" font-size="13" font-weight="700" fill="#F8FAFC">Key Takeaway</text>
  <text x="110" y="820" font-size="12" fill="#94A3B8">ChronosDB does not benchmark itself in isolation — it beats meaningful baselines on every metric, with reproducible evidence.</text>

  <text x="800" y="880" font-size="11" fill="#64748B" text-anchor="middle">Phase 16F  •  Benchmark Results Package  •  `make benchmark`  •  60 Frozen Scenarios</text>
