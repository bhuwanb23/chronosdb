version: "phase7-constraints-v1"
constraints:
  - constraint_id: CON-001
    name: max_recovery_cost
    category: COST
    operator: "<="
    value: 200000
    unit: INR
    severity: HARD
    description: "Recovery intervention cost must not exceed the configured budget."
  - constraint_id: CON-002
    name: min_remaining_inventory
    category: INVENTORY
    operator: ">="
    value: 0
    unit: units
    severity: HARD
    description: "Remaining inventory must stay at or above safety stock."
  - constraint_id: CON-003
    name: max_inventory_commitment
    category: INVENTORY
    operator: "<="
    value: 500
    unit: units
    severity: HARD
    description: "A plan may commit at most 500 units of inventory."
  - constraint_id: CON-004
    name: supplier_approved
    category: SUPPLIER
    operator: "=="
    value: true
    unit: boolean
    severity: HARD
    description: "Any supplier used by the plan must be active and approved."
  - constraint_id: CON-005
    name: max_supplier_risk
    category: SUPPLIER
    operator: "<="
    value: 0.35
    unit: score
    severity: SOFT
    description: "Operational supplier risk should remain below the soft threshold."
  - constraint_id: CON-006
    name: transfer_lane_approved
    category: WAREHOUSE
    operator: "=="
    value: true
    unit: boolean
    severity: HARD
    description: "Any transfer lane used by the plan must be active."
  - constraint_id: CON-007
    name: max_capacity_utilization
    category: CAPACITY
    operator: "<="
    value: 100
    unit: percent
    severity: HARD
    description: "Supplier capacity utilization must not exceed 100 percent."
  - constraint_id: CON-008
    name: max_delay_hours
    category: DELAY
    operator: "<="
    value: 240
    unit: hours
    severity: HARD
    description: "Maximum customer delay must not exceed 10 days."
  - constraint_id: CON-009
    name: regulatory_compliance
    category: REGULATORY
    operator: "=="
    value: true
    unit: boolean
    severity: HARD
    description: "Any alternate supplier used must be regulatory compliant."
