rule_set_version: impact-rules-v1.0.0
domain_model_version: phase4-domain-model-1.0.0
dataset_compatibility:
  - "1.0.0"
rules:
  - rule_id: STATE-001
    version: 1.0.0
    name: effective_state_selection
    inputs: [effective_from, effective_to, as_of_time]
    outputs: [eligible_record]
    units: timestamp
    formula: effective_from <= as_of_time < effective_to
    rounding: none
    failure_conditions: [missing_effective_interval]
  - rule_id: STATE-002
    version: 1.0.0
    name: information_time_selection
    inputs: [ingested_time, as_of_time]
    outputs: [known_record]
    units: timestamp
    formula: ingested_time <= as_of_time
    rounding: none
    failure_conditions: [invalid_ingested_time]
  - rule_id: SUP-001
    version: 1.0.0
    name: outstanding_quantity
    inputs: [ordered_quantity, received_quantity]
    outputs: [outstanding_quantity]
    units: quantity
    formula: max(0, ordered_quantity - received_quantity)
    rounding: decimal(3)
    failure_conditions: [missing_ordered_quantity, missing_received_quantity]
  - rule_id: SUP-004
    version: 1.0.0
    name: disrupted_arrival
    inputs: [original_arrival, outage_end, recovery_lag]
    outputs: [disrupted_arrival]
    units: timestamp
    formula: max(original_arrival, outage_end + recovery_lag)
    rounding: none
    failure_conditions: [missing_arrival, invalid_outage_interval]
  - rule_id: SUP-005
    version: 1.0.0
    name: affected_purchase_order
    inputs: [supplier_id, outstanding_quantity, scope, expected_arrival]
    outputs: [affected_purchase_order]
    units: boolean
    formula: supplier_matches and outstanding_quantity > 0 and scope_matches
    rounding: none
    failure_conditions: [unknown_supplier, unsupported_scope]
  - rule_id: SUP-006
    version: 1.0.0
    name: projected_receipt_quantity
    inputs: [outstanding_quantity]
    outputs: [projected_receipt_quantity]
    units: quantity
    formula: outstanding_quantity
    rounding: decimal(3)
    failure_conditions: [negative_outstanding_quantity]
  - rule_id: INV-003
    version: 1.0.0
    name: component_shortage
    inputs: [required_quantity, allocated_quantity, required_time]
    outputs: [shortage_quantity, shortage_type, resolved_time]
    units: quantity
    formula: max(0, required_quantity - allocated_quantity)
    rounding: decimal(3)
    failure_conditions: [missing_required_time, missing_allocation]
  - rule_id: INV-004
    version: 1.0.0
    name: projected_inventory_balance
    inputs: [opening_available_quantity, receipt_events, consumption_events, transfer_events]
    outputs: [projected_balance]
    units: quantity
    formula: prior_balance + receipts + transfers_in - consumption - transfers_out
    rounding: decimal(3)
    failure_conditions: [missing_opening_state, negative_balance]
  - rule_id: ALLOC-001
    version: 1.0.0
    name: material_allocation
    inputs: [required_quantity, eligible_source_lots, allocation_priority]
    outputs: [allocated_quantity, source_lots, allocation_status]
    units: quantity
    formula: min(required_quantity, sum(eligible_source_lots))
    rounding: decimal(3)
    failure_conditions: [missing_requirement, duplicate_allocation]
  - rule_id: PROD-003
    version: 1.0.0
    name: projected_production_schedule
    inputs: [planned_start, material_ready_time, capacity_ready_time, processing_duration]
    outputs: [projected_start, projected_completion, delay_hours]
    units: timestamp
    formula: max(planned_start, material_ready_time, capacity_ready_time) + processing_duration
    rounding: none
    failure_conditions: [capacity_exceeded, material_unavailable]
  - rule_id: FUL-001
    version: 1.0.0
    name: customer_fulfilment
    inputs: [open_quantity, product_availability_events, delivery_lead_time]
    outputs: [segments, projected_delivery, on_time_quantity, late_quantity]
    units: quantity
    formula: on_time = min(open_quantity, available_by_promised); late = max(0, open - on_time)
    rounding: decimal(3)
    failure_conditions: [missing_promised_delivery, over_fulfilment]
  - rule_id: SLA-001
    version: 1.0.0
    name: sla_classification
    inputs: [projected_delivery, promised_delivery]
    outputs: [sla_status, delay_hours]
    units: hours
    formula: breach when projected_delivery > promised_delivery; delay = max(0, projected - promised)
    rounding: none
    failure_conditions: [missing_promised_delivery]
  - rule_id: FIN-004
    version: 1.0.0
    name: revenue_at_risk
    inputs: [late_quantity, unit_revenue]
    outputs: [revenue_at_risk, currency]
    units: INR
    formula: late_quantity * unit_revenue
    rounding: decimal(2)
    failure_conditions: [missing_unit_revenue, negative_quantity]
  - rule_id: CAU-001
    version: 1.0.0
    name: causal_trace
    inputs: [disruption, affected_records, production_impact, sla_impact]
    outputs: [causal_nodes, causal_edges, attribution]
    units: graph
    formula: link each breach to its production, material, supply, and disruption ancestors
    rounding: none
    failure_conditions: [missing_causal_parent, invalid_entity_reference]
  - rule_id: DQ-001
    version: 1.0.0
    name: state_completeness
    inputs: [required_record_classes, loaded_record_classes]
    outputs: [data_quality_status]
    units: enum
    formula: complete when all required record classes are present
    rounding: none
    failure_conditions: [missing_required_record_class]
